<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f9fa0b;
            background: #f8fafc;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .title { font-weight: bold; font-size: 14px; color: #0f172a; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
        .section-title { font-size: 11px; font-weight: 600; color: #64748b; margin: 8px 0 4px 0; text-transform: uppercase; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: white;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        li:hover { border-color: #3b82f6; transform: translateY(-1px); }
        .link-info { display: flex; flex-direction: column; overflow: hidden; width: 80%; }
        .link-title { font-size: 12px; font-weight: 500; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .link-url { font-size: 10px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { font-size: 11px; font-weight: bold; color: #3b82f6; }
        .empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 20px 0; }
    </style>
</head>
<body>
<div class="header">
    <span class="title">🔥 BookmarkFlow</span>
    <button id="open-dashboard" style="border:none; background:none; cursor:pointer; font-size:14px;">⚙️ Dashboard</button>
</div>

<div class="section-title">Hot Bookmarks (Most Active)</div>
<ul id="hot-list">
    <div class="empty">Analyzing your bookmarks...</div>
</ul>

<script src="popup.js"></script>
</body>
</html>
